<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerekçeli Karar Programı</title>
</head>
<body>
  <!-- Placeholder: existing full content should be preserved in real repo update -->
  <button id="btn-smart-import" class="btn-small">🧠 Akıllı Aktar</button>

  <div id="modal-smart-import" class="modal">
    <div class="modal-content large-modal">
      <div class="modal-header">
        <h2>🧠 Akıllı Klasör İçe Aktarma</h2>
        <span class="close" data-modal="smart-import">&times;</span>
      </div>
      <div class="modal-body">
        <div class="smart-import-info">
          Dosya adı ve içerik örüntüsüne göre belge parçaları ilgili karar başlıklarıyla eşleştirilir.
          Aktarma yalnızca seçtiğiniz satırlar için ve onayınızla yapılır.
        </div>
        <div id="smart-import-summary" class="smart-import-summary"></div>
        <div id="smart-import-list" class="smart-import-list"></div>
        <div class="smart-import-actions">
          <button id="btn-apply-smart-import" class="btn-primary">Seçili Önerileri Bölümlere Aktar</button>
          <button id="btn-close-smart-import" class="btn-secondary">Kapat</button>
        </div>
      </div>
    </div>
  </div>

  <script src="faiz-engine.js"></script>
  <script src="dilekce-engine.js"></script>
  <script src="karar-import-engine.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
