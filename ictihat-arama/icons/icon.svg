<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#0f2442"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Scale/Balance Icon -->
  <g transform="translate(256, 180)">
    <!-- Top beam -->
    <rect x="-120" y="-8" width="240" height="16" rx="8" fill="#ed8936"/>
    
    <!-- Center pillar -->
    <rect x="-12" y="0" width="24" height="140" rx="8" fill="#fff"/>
    
    <!-- Base -->
    <rect x="-80" y="130" width="160" height="20" rx="10" fill="#fff"/>
    
    <!-- Left pan -->
    <circle cx="-100" cy="60" r="50" fill="none" stroke="#fff" stroke-width="8"/>
    <line x1="-100" y1="0" x2="-100" y2="10" stroke="#ed8936" stroke-width="6"/>
    
    <!-- Right pan -->
    <circle cx="100" cy="60" r="50" fill="none" stroke="#fff" stroke-width="8"/>
    <line x1="100" y1="0" x2="100" y2="10" stroke="#ed8936" stroke-width="6"/>
  </g>
  
  <!-- Search magnifier -->
  <g transform="translate(380, 380)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ed8936" stroke-width="12"/>
    <line x1="32" y1="32" x2="55" y2="55" stroke="#ed8936" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
